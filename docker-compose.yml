services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aimpf
      POSTGRES_USER: aimpf
      POSTGRES_PASSWORD: aimpf
    ports: ["5432:5432"]
    volumes: ["aimpf_pg:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aimpf:aimpf@postgres:5432/aimpf
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [postgres]
volumes:
  aimpf_pg:
